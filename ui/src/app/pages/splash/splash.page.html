<ion-content class="min-h-100dvh bg-white relative overflow-hidden flex flex-col">
  <!-- soft glows -->
  <div class="pointer-events-none absolute -top-24 -left-24 w-28rem h-28rem rounded-full blur-3xl opacity-70 bg-glow-purple"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 w-30rem h-30rem rounded-full blur-3xl opacity-70 bg-glow-blue"></div>

  <!-- Top logo area ~40% -->
  <div class="h-[40vh] flex items-end justify-center pt-10">
    <img src="assets/branding/logo-app.png" alt="Aptimind logo" class="max-h-260 w-auto drop-shadow-app" />
  </div>

  <!-- Title and description -->
  <div class="flex-1 flex items-start justify-center">
    <div class="text-center px-6">
      <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">APTIMIND</h1>
      <p class="mt-2 text-slate-600">Unlock your potential with guided practice for aptitude and reasoning.</p>
    </div>
  </div>

  <!-- Subtle loading indicator at the bottom centre -->
  <div class="pointer-events-none absolute inset-x-0 px-6" style="bottom: calc(env(safe-area-inset-bottom) + 98px);">
    <div class="mx-auto w-10/12 max-w-xl rounded-full overflow-hidden">
      <ion-progress-bar aria-label="Loading" type="indeterminate" class="opacity-90 brand-gradient"></ion-progress-bar>
    </div>
  </div>
</ion-content>
