<ion-header translucent>
  <ion-toolbar class="bg-white">
    <ion-title class="text-base">Hello, Sarah!</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" routerLink="/tabs/profile">
        <ion-icon name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="ion-padding bg-surface">
  <section class="p-4 bg-white rounded-xl shadow-sm">
    <div class="text-sm text-slate-500">Continue Learning</div>
    <div class="mt-1 font-medium">Quantitative Aptitude: Number System</div>
    <div class="mt-3 h-2 bg-slate-200 rounded-full">
      <div class="h-2 bg-primary rounded-full" style="width: 45%"></div>
    </div>
    <div class="mt-3 text-right">
      <ion-button size="small">Continue</ion-button>
    </div>
  </section>

  <section class="mt-5">
    <div class="flex items-center justify-between">
      <h3 class="font-semibold">Daily Challenge</h3>
      <ion-button fill="clear" size="small">View</ion-button>
    </div>
    <div class="mt-3 grid grid-cols-2 gap-3">
      <button class="p-3 bg-white rounded-xl shadow-sm text-left">
        <div class="text-slate-500 text-xs">Logical Reasoning</div>
        <div class="mt-1 font-medium">Practice</div>
      </button>
      <button class="p-3 bg-white rounded-xl shadow-sm text-left">
        <div class="text-slate-500 text-xs">Verbal Ability</div>
        <div class="mt-1 font-medium">Practice</div>
      </button>
      <button class="p-3 bg-white rounded-xl shadow-sm text-left">
        <div class="text-slate-500 text-xs">Data Interpretation</div>
        <div class="mt-1 font-medium">Practice</div>
      </button>
      <button class="p-3 bg-white rounded-xl shadow-sm text-left">
        <div class="text-slate-500 text-xs">Quantitative Aptitude</div>
        <div class="mt-1 font-medium">Practice</div>
      </button>
    </div>
  </section>
</ion-content>
