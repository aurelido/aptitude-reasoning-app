<ion-header class="ion-no-border">
  <ion-toolbar>
    <app-home-header
      [user]="user()"
      [greeting]="greeting"
      [unreadNotifications]="unreadNotifications()"
      (profileClick)="navigateToProfile()"
      (notificationsClick)="navigateToNotifications()"
      (settingsClick)="navigateToSettings()"
    />
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="ion-padding bg-surface">
  <!-- Continue Learning Card -->
  <app-continue-learning-card
    [activity]="continueActivity()"
    (continue)="continueLearning()"
  />

  <!-- Daily Challenge Card -->
  <app-daily-challenge-card
    [challenge]="dailyChallenge()"
    (start)="startDailyChallenge()"
  />

  <!-- Quick Practice Section -->
  <app-quick-practice-section
    [options]="quickPracticeOptions()"
    (startPractice)="startQuickPractice($event)"
  />

  <!-- Explore Categories Section -->
  <app-categories-section
    [categories]="categories()"
    (viewAll)="viewAllCategories()"
    (categoryClick)="navigateToCategory($event)"
  />

  <!-- Recommended Topics Section -->
  <app-recommended-topics-section
    [topics]="recommendedTopics()"
    (topicClick)="navigateToTopic($event)"
  />
</ion-content>
