<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="home-header">
      <!-- Profile Picture/Avatar -->
      <div class="profile-section" (click)="navigateToProfile()">
        @if (user().avatar) {
          <img [src]="user().avatar" [alt]="user().name" class="profile-avatar" />
        } @else {
          <div class="profile-avatar-fallback">
            <span>{{ user().initials }}</span>
          </div>
        }
        
        <!-- Greeting and Name -->
        <div class="greeting-section">
          <p class="greeting-text">{{ greeting }}</p>
          <h2 class="user-name">{{ user().firstName }}!</h2>
        </div>
      </div>
      
      <div class="header-actions">
        <!-- Notifications Icon with Badge -->
        <ion-button fill="clear" (click)="navigateToNotifications()" class="notification-button">
          <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
          @if (unreadNotifications() > 0) {
            <ion-badge class="notification-badge">{{ unreadNotifications() }}</ion-badge>
          }
        </ion-button>
        
        <!-- Settings Icon -->
        <ion-button fill="clear" (click)="navigateToSettings()" class="settings-button">
          <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="ion-padding bg-surface">
  <section class="p-4 bg-white rounded-xl shadow-sm">
    <div class="text-sm text-slate-500">Continue Learning</div>
    <div class="mt-1 font-medium">Quantitative Aptitude: Number System</div>
    <div class="mt-3 h-2 bg-slate-200 rounded-full">
      <div class="h-2 bg-primary rounded-full" style="width: 45%"></div>
    </div>
    <div class="mt-3 text-right">
      <ion-button size="small">Continue</ion-button>
    </div>
  </section>

  <section class="mt-5">
    <div class="flex items-center justify-between">
      <h3 class="font-semibold">Daily Challenge</h3>
      <ion-button fill="clear" size="small">View</ion-button>
    </div>
    <div class="mt-3 grid grid-cols-2 gap-3">
      <button class="p-3 bg-white rounded-xl shadow-sm text-left">
        <div class="text-slate-500 text-xs">Logical Reasoning</div>
        <div class="mt-1 font-medium">Practice</div>
      </button>
      <button class="p-3 bg-white rounded-xl shadow-sm text-left">
        <div class="text-slate-500 text-xs">Verbal Ability</div>
        <div class="mt-1 font-medium">Practice</div>
      </button>
      <button class="p-3 bg-white rounded-xl shadow-sm text-left">
        <div class="text-slate-500 text-xs">Data Interpretation</div>
        <div class="mt-1 font-medium">Practice</div>
      </button>
      <button class="p-3 bg-white rounded-xl shadow-sm text-left">
        <div class="text-slate-500 text-xs">Quantitative Aptitude</div>
        <div class="mt-1 font-medium">Practice</div>
      </button>
    </div>
  </section>
</ion-content>
