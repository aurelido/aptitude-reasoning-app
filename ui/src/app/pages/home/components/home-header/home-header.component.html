<div class="home-header">
  <!-- Profile Picture/Avatar -->
  <div class="profile-section" (click)="profileClick.emit()">
    @if (user.avatar) {
      <img [src]="user.avatar" [alt]="user.name" class="profile-avatar" />
    } @else {
      <div class="profile-avatar-fallback">
        <span>{{ user.initials }}</span>
      </div>
    }

    <!-- Greeting and Name -->
    <div class="greeting-section">
      <p class="greeting-text">{{ greeting }}</p>
      <h2 class="user-name">{{ user.firstName }}!</h2>
    </div>
  </div>

  <div class="header-actions">
    <!-- Notifications Icon with Badge -->
    <ion-button
      fill="clear"
      (click)="notificationsClick.emit()"
      class="notification-button"
    >
      <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
      @if (unreadNotifications > 0) {
        <ion-badge class="notification-badge">{{ unreadNotifications }}</ion-badge>
      }
    </ion-button>

    <!-- Settings Icon -->
    <ion-button
      fill="clear"
      (click)="settingsClick.emit()"
      class="settings-button"
    >
      <ion-icon name="settings-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </div>
</div>
