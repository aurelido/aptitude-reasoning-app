<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Abstract geometric pattern representing abstract reasoning -->
  <g>
    <!-- Triangle -->
    <path d="M50 15 L75 55 L25 55 Z" stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round"/>
    
    <!-- Circle -->
    <circle cx="35" cy="75" r="10" stroke="currentColor" stroke-width="3" fill="none"/>
    
    <!-- Square -->
    <rect x="55" y="65" width="20" height="20" stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round"/>
    
    <!-- Connecting lines showing pattern -->
    <line x1="50" y1="55" x2="35" y2="65" stroke="currentColor" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="55" x2="65" y2="65" stroke="currentColor" stroke-width="2" opacity="0.6"/>
    
    <!-- Small decorative shapes showing sequence -->
    <circle cx="20" cy="30" r="3" fill="currentColor" opacity="0.7"/>
    <circle cx="80" cy="30" r="3" fill="currentColor" opacity="0.7"/>
  </g>
</svg>
