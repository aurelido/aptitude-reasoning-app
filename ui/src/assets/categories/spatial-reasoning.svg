<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 3D cube in isometric perspective representing spatial reasoning -->
  <g>
    <!-- Front face -->
    <path d="M50 35 L75 50 L75 75 L50 90 L25 75 L25 50 Z" 
          stroke="currentColor" 
          stroke-width="3" 
          fill="none" 
          stroke-linejoin="round"/>
    
    <!-- Top face -->
    <path d="M50 10 L75 25 L75 50 L50 35 L25 50 L25 25 Z" 
          stroke="currentColor" 
          stroke-width="3" 
          fill="none" 
          stroke-linejoin="round"/>
    
    <!-- Connecting edges -->
    <line x1="50" y1="10" x2="50" y2="35" stroke="currentColor" stroke-width="3"/>
    <line x1="75" y1="25" x2="75" y2="50" stroke="currentColor" stroke-width="3"/>
    <line x1="25" y1="25" x2="25" y2="50" stroke="currentColor" stroke-width="3"/>
    
    <!-- Internal construction lines for depth -->
    <line x1="50" y1="35" x2="50" y2="90" stroke="currentColor" stroke-width="2" opacity="0.5"/>
    
    <!-- Highlight corners for 3D effect -->
    <circle cx="50" cy="10" r="2.5" fill="currentColor" opacity="0.8"/>
    <circle cx="75" cy="25" r="2.5" fill="currentColor" opacity="0.8"/>
    <circle cx="25" cy="25" r="2.5" fill="currentColor" opacity="0.8"/>
  </g>
</svg>
